<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-Service Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Self-Service Analytics</h1>
    <p>Upload a CSV, filter it, and chart it. No SQL needed.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Upload data</h2>
      <div class="row">
        <input type="file" id="fileInput" accept=".csv" aria-label="CSV file">
        <button id="uploadBtn" class="primary">Upload</button>
      </div>
      <p id="uploadMsg" class="msg" role="status"></p>
    </section>

    <div id="workspace" hidden>
      <section class="panel">
        <h2>Preview</h2>
        <p class="hint">First 20 rows of your file.</p>
        <div class="table-wrap"><table id="previewTable"></table></div>
      </section>

      <section class="panel">
        <h2>Columns and filters</h2>
        <fieldset>
          <legend>Show these columns</legend>
          <div id="columnList" class="checks"></div>
        </fieldset>
        <h3>Filters</h3>
        <p class="hint">Rows must match every filter. Leave a value empty to ignore that filter.</p>
        <div id="filters"></div>
        <div class="row">
          <button id="addFilterBtn" class="secondary">Add filter</button>
          <button id="applyBtn" class="primary">Apply filters</button>
        </div>
        <p id="queryMsg" class="msg" role="status"></p>
      </section>

      <section class="panel" id="resultPanel" hidden>
        <h2>Results</h2>
        <p id="resultInfo" class="hint"></p>
        <div class="table-wrap"><table id="resultTable"></table></div>
        <div class="row">
          <button id="exportBtn" class="secondary">Export as CSV</button>
        </div>
        <p id="exportMsg" class="msg" role="status"></p>
      </section>

      <section class="panel">
        <h2>Chart</h2>
        <div class="controls">
          <label>Group by <select id="groupBy"></select></label>
          <label>Calculate <select id="agg">
            <option value="sum">sum</option>
            <option value="mean">mean</option>
            <option value="count">count</option>
          </select></label>
          <label>Of column <select id="valueCol"></select></label>
          <label>Chart type <select id="chartType">
            <option value="bar">bar</option>
            <option value="line">line</option>
            <option value="pie">pie</option>
          </select></label>
          <button id="chartBtn" class="primary">Draw chart</button>
        </div>
        <p id="chartMsg" class="msg" role="status"></p>
        <div class="chart-box"><canvas id="chart"></canvas></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
